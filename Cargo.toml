[package]
name = "dynamic-island"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_System_RemoteDesktop", "Win32_Globalization", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "UI_Composition", "UI_Composition_Desktop", "System", "UI", "Foundation", "Foundation_Numerics", "Graphics", "Graphics_DirectX", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_Input_KeyboardAndMouse"] }
windows-numerics = "0.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Optimized build with the debug-only Demo menu, for benchmarking non-Idle states (scripts/bench.ps1 -Demo).
[profile.profiling]
inherits = "release"
debug-assertions = true
