[package]
name = "dynamic-island"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_System_RemoteDesktop", "Win32_Globalization", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "UI_Composition", "UI_Composition_Desktop", "System", "UI"] }
windows-numerics = "0.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
